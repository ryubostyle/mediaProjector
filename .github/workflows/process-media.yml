name: Process Media and Film YAML

on:
  push:
    paths:
      - 'trushes/**'
      - 'core/**'
      - 'main.py'
  workflow_dispatch: # GitHub Actionsの画面から手動でも実行できるようにする

jobs:
  run-media-processor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v7
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Cached Venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run Main Processor
        run: poetry run python main.py

      - name: Commit and push processed files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更があればステージングしてコミット
          git add trushes/
          git status
          
          # 変更がある場合のみコミット＆プッシュを実行
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sort media files and parse film.yaml [skip ci]"
            
            # 【ここがポイント】プッシュ前にリモートの変更を安全に同期する
            git pull origin main --rebase --autostash
            
            # 同期が成功したらプッシュ
            git push origin main
          fi
