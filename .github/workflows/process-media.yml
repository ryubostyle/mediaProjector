name: Process Media and Film YAML

on:
  push:
    paths:
      - 'trushes/**'
      - 'core/**'
      - 'main.py'
  workflow_dispatch: # GitHub Actionsの画面から手動でも実行できるようにする

jobs:
  run-media-processor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v7
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load Cached Venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run Main Processor
        run: poetry run python main.py

      - name: Commit and push processed files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ブランチの追跡設定を明示的に強制する
          git branch --set-upstream-to=origin/main main || true
          
          git add trushes/
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sort media files and parse film.yaml [skip ci]"
            
            # 【エラートラップ＆自動調停ループ】
            # プッシュが拒否された場合、強制的にリモートを取り込んでから最大3回リトライする
            max_retries=3
            count=0
            success=false
            
            while [ $count -lt $max_retries ]; do
              echo "Push attempt $((count+1)) of $max_retries..."
              
              # 1. リモートの最新をフェッチ
              git fetch origin main
              
              # 2. リベースでリモートの変更を統合（コンフリクト時はローカル優先または安全にマージ）
              git pull origin main --rebase --autostash || true
              
              # 3. プッシュを実行
              if git push origin HEAD:main; then
                success=true
                break
              else
                echo "Push rejected. Retrying in 3 seconds..."
                sleep 3
                count=$((count+1))
              fi
            done
            
            if [ "$success" = false ]; then
              echo "Error: Failed to push after $max_retries attempts."
              exit 1
            fi
          fi
