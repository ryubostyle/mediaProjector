name: Auto Process Media Trushes

on:
  push:
    paths:
      - 'trushes/**'  # trushes/ フォルダ内へのファイルの追加・変更を検知

jobs:
  process-files:
    runs-on: ubuntu-latest
    
    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. メディア処理スクリプトの実行（Pythonスクリプトを呼び出し）
      - name: Run Media Processor
        run: |
          python -c "from core.media_processor import MediaProcessor; processor = MediaProcessor(); print(processor.process_recovered_files())"

      # 4. 仕分け結果（移動されたファイル）を自動でGitにコミット＆プッシュ
      - name: Commit and push processed files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trushes/
          git diff --staged --quiet || git commit -m "Auto-sort media files in trushes/"
          git push
